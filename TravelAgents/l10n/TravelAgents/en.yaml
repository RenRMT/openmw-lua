# TravelAgents -- English strings.

# --- settings ------------------------------------------------------------
settingsPage: "Travel Agents"
settingsPageDescription: "Plan journeys across travel modes."

plannerGroup: "Planner"
plannerGroupDescription: "Set keybinds for the travel planner."

plannerKey: "Open planner"
plannerKeyDescription: "Plan your travels."

plannerController: "Open planner (controller)"
plannerControllerDescription: "Plan your travels."

# The escape hatch, for a load order with a travel service the shipped
# table of operator locations has never heard of.
searchGroup: "Travel network"
searchGroupDescription: "How the mod finds the travel services in your load order."
fullSearch: "Search every cell"
fullSearchDescription: |-
  Turn this on if Travel operators are not included in the network.
  This will rebuild the network by searching every cell, and takes
  about half a minute in the background.

faresGroup: "Fares"
faresGroupDescription: "Added cost for booking a whole journey"

legSurcharge: "Extra per leg (%)"
legSurchargeDescription: "Added for every leg past the first."

modeChangeSurcharge: "Extra per change (%)"
modeChangeSurchargeDescription: "Added for every additional mode of transport."

# --- the window ----------------------------------------------------------
from: "From {place}"
nowhereToGo: "No stop can be reached from here."
nowhereWithThisManyChanges: "Nothing that far from here."

# Tabs, grouped by number of transfers
tabDirect: "Direct"
tabChanges: "{changes, plural, one {1 change} other {# changes}}"
tabChangesPlus: "{changes}+ changes"
tabAll: "All"

# The destination list is paged: MWUI has no scrollbar, so a list longer
# than the window would otherwise put its tail out of reach.
pageOf: " {page} / {pages}"
pagePrev: "< back"
pageNext: "more >"

# The chosen journey, condensed into the strip under the list.
via: "via {places}"
pickAStop: "Pick a place to see the journey."
arrivingAt: "Arriving at {place}"
plannerHint: "Press {key} to plan a journey from here."
plannerUnbound: "Bind a key in the script options to plan a journey."
controllerButton: "{button}"
eitherBinding: "{first} or {second}"
close: "Close"

# --- how a journey reads --------------------------------------------------
journeyDirect: "direct: {hours} h, {fare} gold"
journeyOnFoot: "on foot: {hours} h"
journeySameVehicle: "{legs} legs: {hours} h, {fare} gold"
journeyChanging: "{changes, plural, one {1 change} other {# changes}}: {hours} h, {fare} gold"

# --- booking -------------------------------------------------------------
book: "Travel here"
fareLine: "fare: {base} gold"
surchargeLine: ", plus {extra} gold fees"
youHave: "You have {gold} gold"
bookFree: "Travel here"
cannotAfford: "That journey costs {fare} gold; you are {short} short."
noRoute: "There is no way through to that stop from here."
bookingFailed: "That journey cannot be made."
