# TravelNetwork -- English strings.
#
# Keys match the settings entries in scripts/TravelNetwork/player.lua and the
# planner window it draws. A setting named `foo` takes its description from
# `fooDescription`, so the two always travel together.

# --- settings ------------------------------------------------------------
settingsPage: "Travel Network"
settingsPageDescription: "Plan journeys across silt striders, boats, gondolas and guild guides."

plannerGroup: "Planner"
plannerGroupDescription: "The key that opens the journey planner."

plannerKey: "Open the planner"
plannerKeyDescription: "Shows every stop you can reach from where you are standing."

routingGroup: "Routing"
routingGroupDescription: "What the planner will go out of its way to avoid. Both are distances in game units -- how far a detour is worth taking to save the change. They decide which route you are offered, not what it costs."

transferPenalty: "Detour worth avoiding a stop"
transferPenaltyDescription: "How much of a detour is worth avoiding one extra leg, even on the same kind of vehicle. Higher means fewer, longer legs."

modeChangePenalty: "Detour worth avoiding a change of vehicle"
modeChangePenaltyDescription: "Added on top when the change is from one kind of vehicle to another -- strider to boat, boat to guild guide. Higher means the planner keeps you on one network."

faresGroup: "Fares"
faresGroupDescription: "What booking a whole journey at one counter costs on top of the legs themselves. Percentages of the fare, added together rather than compounded. A single leg is never surcharged."

legSurcharge: "Extra per additional leg (%)"
legSurchargeDescription: "Added to the fare for every leg past the first, even on the same kind of vehicle. Somebody has to arrange the connection."

modeChangeSurcharge: "Extra per change of vehicle (%)"
modeChangeSurchargeDescription: "Added on top again whenever the journey changes from one kind of transport to another, since the two operators keep separate books."

# --- the window ----------------------------------------------------------
windowTitle: "Travel Network"
from: "From {place}"
servedBy: "Served by {modes}"
nowhereToGo: "No stop can be reached from here."
plannerHint: "Press {key} to plan a journey from here."
plannerUnbound: "Bind a key under Options, Scripts, Travel Network to plan a journey."
controllerButton: "your controller button"
andMore: "...and {count} more -- show them"
showFewer: "Show fewer"
close: "Close"

# --- how a journey reads --------------------------------------------------
# One vehicle from end to end is "direct" however many doors it passes
# through; what a player wants to spot in a list is the journey that makes
# them change.
journeyDirect: "direct -- {hours} h, {fare} gold"
journeyOnFoot: "on foot -- {hours} h"
journeySameVehicle: "{legs} legs, all by {mode} -- {hours} h, {fare} gold"
journeyChanging: "{changes, plural, one {1 change of vehicle} other {# changes of vehicle}} -- {hours} h, {fare} gold"

# --- booking -------------------------------------------------------------
book: "Travel here -- {fare} gold"
surchargeNote: "{base} gold in fares, plus {percent}% ({extra} gold) for booking it in one go"
bookFree: "Travel here -- no charge"
cannotAfford: "That journey costs {fare} gold -- you are {short} short."
arrived: "You arrive at {place}. {hours} hours on the road, {fare} gold."
arrivedFree: "You arrive at {place}. {hours} hours on the road."
noRoute: "There is no way through to that stop from here."
bookingFailed: "That journey cannot be made."
